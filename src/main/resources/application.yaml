spring:
  application:
    name: blogapp
  datasource:
    url: jdbc:postgresql://${RDS_URL}:5432/postgres
    username: ${RDS_USERNAME}
    password: ${RDS_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: ALWAYS
  security:
    user:
      name: test
      password: test
    oauth2:
      client:
        registration:

          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
          github:
            client-id: ${GHUB_CLIENT_ID}
            client-secret: ${GHUB_CLIENT_SECRET}
            scope:
              - read:user
              - user:email

server:
  port: 2399

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

app:
  frontend-url: https://nullcanvas.blog