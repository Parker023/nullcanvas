spring:
  application:
    name: blogapp
  datasource:
    url: jdbc:postgresql://${RDS_URL}:5432/postgres
    username: ${RDS_USERNAME}
    password: ${RDS_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: ALWAYS
  security:
    oauth2:
      client:
        registration:

          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
          github:
            client-id: ${GHUB_CLIENT_ID}
            client-secret: ${GHUB_CLIENT_SECRET}
            scope:
              - read:user
              - user:email
  mail:
    host: smtp.resend.com
    port: 587
    username: resend
    password: ${RESEND_API_KEY}

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}
      ssl:
        enabled: true


server:
  port: 2399
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

app:
  frontend-url: http://nullcanvas.blog
  otp:
    otp-ttl: 5m
    rate-limit:
      window: 1h
      max-req: 5
      cooldown: 30s
      attempt:
        window: 5m
        retries: 5
  mail:
    from: nullcanvas.admin@nullcanvas.blog



logging:
  level:
    root: info
    com.nullcanvas.blog: debug
