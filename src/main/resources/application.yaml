spring:
  application:
    name: blogapp
  datasource:
    # Neon Postgres. NEON_HOST must be the "-pooler" endpoint (not the direct
    # host, which was only for the restore). SSL is required by Neon.
    url: jdbc:postgresql://${NEON_HOST}/${NEON_DB}?sslmode=require
    username: ${NEON_USERNAME}
    password: ${NEON_PASSWORD}
    hikari:
      # Neon free plan: 100 CU-hours/month, 0.25 CU floor. A single idle Hikari
      # connection keeps Neon's compute from suspending (730h x 0.25 ~ 183
      # CU-hours, ~2x the allowance). Draining the pool to zero lets Neon sleep
      # after ~5 min idle; the 15s connection-timeout absorbs the ~500ms wake on
      # the next request.
      minimum-idle: 0
      idle-timeout: 30000
      connection-timeout: 15000
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: ALWAYS
  security:
    oauth2:
      client:
        registration:

          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
          github:
            client-id: ${GHUB_CLIENT_ID}
            client-secret: ${GHUB_CLIENT_SECRET}
            scope:
              - read:user
              - user:email
  mail:
    host: smtp.resend.com
    port: 587
    username: resend
    password: ${RESEND_API_KEY}

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true


server:
  port: 2399
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

app:
  frontend-url: https://nullcanvas.blog
#  frontend-url: http://localhost:5173
  otp:
    otp-ttl: 5m
    rate-limit:
      window: 1h
      max-req: 5
      cooldown: 30s
      attempt:
        window: 5m
        retries: 5
  chunk-size: 5000
  recent-post-count: 5
  s3:
    bucket-name: nullcanvas-assets
    region: ap-south-1
  mail:
    from: nullcanvas.admin@nullcanvas.blog


logging:
  level:
    root: info
    com.nullcanvas.blog: debug
